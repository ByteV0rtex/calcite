[workspace]
resolver = "3"
members = ["crates/calcite", "crates/calcite-core", "crates/calcite-login"]
exclude = ["vendor"]

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.95"
authors = ["Calcite contributors"]

[workspace.dependencies]
# Versions follow Modrinth's workspace so the backend and Calcite share one copy.
anyhow = "1"
thiserror = "2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "sync", "time", "macros", "fs", "process"] }
futures = "0.3.34"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.28.0", features = ["serde", "v4"] }
chrono = { version = "0.4.45", features = ["serde"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "gzip", "brotli", "rustls-no-provider", "query", "form"] }
url = "2.5.8"
dirs = "7.0.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "rayon"] }
parking_lot = "0.12.5"
rust-embed = "8.13.0"
smallvec = "1.16.3"
dashmap = "6.2.1"

[profile.dev]
# Keep debug builds small: this machine is short on disk.
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 4
strip = "debuginfo"
