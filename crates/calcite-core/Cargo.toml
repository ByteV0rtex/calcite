[package]
name = "calcite-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
reqwest.workspace = true
url.workspace = true
chrono.workspace = true
dirs.workspace = true
reflink-copy = "0.1.33"
fs4 = "1.1.0"
walkdir = "2.5.0"
# Modrinth sign-in (same versions as Modrinth App)
aes-gcm = "0.11.1"
base64 = "0.23.1"
hkdf = "0.13.0"
p256 = { version = "0.14.0", features = ["ecdh"] }
rand = "=0.10.3"
sha2 = "0.11.1"
sha1 = "0.11.0"
image.workspace = true
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
toml = "0.8.23"
tokio = { workspace = true, features = ["net", "io-util"] }
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "runtime-tokio"] }

[dev-dependencies]
tempfile = "3.27.0"
# Only for the render_svg / brand_icons examples (brand PNGs and icons).
resvg = { version = "0.45.1", default-features = false }
image = { workspace = true, features = ["ico"] }
tokio = { workspace = true, features = ["rt", "macros"] }
