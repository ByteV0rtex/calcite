[package]
name = "calcite"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A fast, native Minecraft launcher"

[[bin]]
name = "calcite"
path = "src/main.rs"

[features]
# Dev-only: `calcite --snapshot <page> <out.png>` renders a page to an image.
snapshot = ["dep:gpui-pre", "dep:gpui-pre-platform"]

[dependencies]
gpui-kit = "=0.9.1"
# Only for the dev snapshot feature: turns on offscreen rendering in GPUI itself.
gpui-pre = { version = "=0.3.12", optional = true, features = ["test-support"] }
gpui-pre-platform = { version = "=0.3.12", optional = true, features = ["test-support"] }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures.workspace = true
base64 = "0.23.1"
bytes = "1.12.1"
tracing.workspace = true
tracing-subscriber.workspace = true
reqwest.workspace = true
image.workspace = true
parking_lot.workspace = true
rust-embed.workspace = true
smallvec.workspace = true
url.workspace = true
uuid.workspace = true
reflink-copy = "0.1.33"
# Opt-in desktop notifications (already built for the backend).
notify-rust = "4.19.0"
dirs.workspace = true
chrono.workspace = true
calcite-core = { path = "../calcite-core" }
minecraft-meta-manifest = { path = "../../vendor/modrinth/packages/minecraft-meta-manifest" }
theseus = { path = "../../vendor/modrinth/packages/app-lib", features = ["native-events"] }

[target.'cfg(windows)'.dependencies]
# Release builds are GUI apps; `calcite list` etc. attach to the parent console.
windows-sys = { version = "0.61.2", features = ["Win32_System_Console"] }

[target.'cfg(windows)'.build-dependencies]
# Puts the icon and version info into calcite.exe.
winresource = "0.1.34"

[dev-dependencies]
tempfile = "3.27.0"
