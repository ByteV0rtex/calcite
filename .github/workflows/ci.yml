name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Also make optimized release builds (slow)
        type: boolean
        default: false

# A newer push makes older runs on the same branch pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries (GPUI, WebKitGTK for sign-in)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
            libssl-dev pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Fetch and patch the launcher backend
        shell: bash
        run: scripts/sync-backend.sh

      # Windows builds Rust far faster on a Dev Drive (ReFS, no antivirus
      # scanning). If the action ever fails, the normal disk still works.
      - name: Fast build disk (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        uses: samypr100/setup-dev-drive@v3
        with:
          drive-size: 24GB
          drive-format: ReFS
          env-mapping: |
            CARGO_TARGET_DIR,{{ DEV_DRIVE }}/target

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> ${{ env.CARGO_TARGET_DIR || 'target' }}"

      # Formatting and lints don't depend on the OS: check them once or twice,
      # not on the slow Windows runners.
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --check -p calcite -p calcite-core -p calcite-login

      - name: Lint
        if: runner.os != 'Windows'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # Optimized builds only when asked for (Run workflow → release) or for
      # a version tag; nobody needs one on every push.
      - name: Release build
        if: (github.event_name == 'workflow_dispatch' && inputs.release) || startsWith(github.ref, 'refs/tags/')
        run: cargo build --release -p calcite

      - uses: actions/upload-artifact@v4
        if: (github.event_name == 'workflow_dispatch' && inputs.release) || startsWith(github.ref, 'refs/tags/')
        with:
          name: calcite-${{ runner.os }}
          path: |
            ${{ env.CARGO_TARGET_DIR || 'target' }}/release/calcite
            ${{ env.CARGO_TARGET_DIR || 'target' }}/release/calcite.exe
          if-no-files-found: error
