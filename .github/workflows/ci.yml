name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Also make optimized release builds (slow)
        type: boolean
        default: false

# A newer push makes older runs on the same branch pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Only used to attach installers to a draft release on version tags.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries (GPUI, WebKitGTK for sign-in)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
            libssl-dev pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Fetch and patch the launcher backend
        shell: bash
        run: scripts/sync-backend.sh

      # Windows builds Rust far faster on a Dev Drive (ReFS, no antivirus
      # scanning). If the action ever fails, the normal disk still works.
      - name: Fast build disk (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        uses: samypr100/setup-dev-drive@v3
        with:
          drive-size: 24GB
          drive-format: ReFS
          env-mapping: |
            CARGO_TARGET_DIR,{{ DEV_DRIVE }}/target

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> ${{ env.CARGO_TARGET_DIR || 'target' }}"

      # Formatting and lints don't depend on the OS: check them once or twice,
      # not on the slow Windows runners.
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --check -p calcite -p calcite-core -p calcite-login

      - name: Lint
        if: runner.os != 'Windows'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # Optimized builds and installers only when asked for (Run workflow →
      # release) or for a version tag; nobody needs one on every push.
      - name: Release build
        if: (github.event_name == 'workflow_dispatch' && inputs.release) || startsWith(github.ref, 'refs/tags/')
        env:
          # Turns on CurseForge; unset (forks, pull requests) just leaves it off.
          CALCITE_CURSEFORGE_KEY: ${{ secrets.CALCITE_CURSEFORGE_KEY }}
        run: cargo build --release -p calcite -p calcite-login

      - name: Package (macOS .app and .dmg)
        if: runner.os == 'macOS' && ((github.event_name == 'workflow_dispatch' && inputs.release) || startsWith(github.ref, 'refs/tags/'))
        run: SKIP_BUILD=1 scripts/package-macos.sh

      - name: Package (Linux .deb and AppImage)
        if: runner.os == 'Linux' && ((github.event_name == 'workflow_dispatch' && inputs.release) || startsWith(github.ref, 'refs/tags/'))
        run: |
          sudo apt-get install -y --no-install-recommends desktop-file-utils
          desktop-file-validate packaging/linux/com.calcite.launcher.desktop
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          SKIP_BUILD=1 APPIMAGETOOL="$RUNNER_TEMP/appimagetool" scripts/package-linux.sh

      - name: Package (Windows installer and portable .zip)
        if: runner.os == 'Windows' && ((github.event_name == 'workflow_dispatch' && inputs.release) || startsWith(github.ref, 'refs/tags/'))
        shell: pwsh
        run: scripts/package-windows.ps1 -SkipBuild

      # Install each package the way a player would, start Calcite, and check
      # it stays up and opens its data folder. Catches missing files and
      # missing libraries, not just build errors.
      - name: Try the installers (macOS)
        if: runner.os == 'macOS' && ((github.event_name == 'workflow_dispatch' && inputs.release) || startsWith(github.ref, 'refs/tags/'))
        run: |
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" dist/Calcite-*.dmg
          ditto "$mnt/Calcite.app" "$HOME/Applications/Calcite.app"
          hdiutil detach "$mnt"
          app="$HOME/Applications/Calcite.app/Contents/MacOS"
          test -x "$app/calcite-login"
          "$app/calcite" help
          CALCITE_DATA_ID=CalciteCI "$app/calcite" &
          pid=$!
          sleep 25
          kill -0 $pid
          grep -E "backend init finished .*: ok" "$HOME/Library/Application Support/CalciteCI/calcite.log"
          kill $pid

      - name: Try the installers (Linux, in a clean Ubuntu)
        if: runner.os == 'Linux' && ((github.event_name == 'workflow_dispatch' && inputs.release) || startsWith(github.ref, 'refs/tags/'))
        run: |
          # A fresh container has only what the .deb pulls in, so a missing
          # dependency shows up here instead of on a player's computer.
          docker run --rm -v "$PWD/dist:/dist:ro" ubuntu:24.04 bash -euxc '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq /dist/calcite_*.deb xvfb xauth mesa-vulkan-drivers procps >/dev/null
            for bin in /usr/bin/calcite /usr/bin/calcite-login; do
              if ldd "$bin" | grep "not found"; then exit 1; fi
            done
            calcite help
            export CALCITE_DATA_ID=CalciteCI
            xvfb-run -a calcite > /tmp/gui.log 2>&1 &
            sleep 25
            pgrep -x calcite || { cat /tmp/gui.log; exit 1; }
            grep -E "backend init finished .*: ok" ~/.local/share/CalciteCI/calcite.log
          '
          chmod +x dist/*.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 ./dist/Calcite-*.AppImage help

      - name: Try the installers (Windows setup and portable)
        if: runner.os == 'Windows' && ((github.event_name == 'workflow_dispatch' && inputs.release) || startsWith(github.ref, 'refs/tags/'))
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist\*-setup.exe)[0].FullName
          Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER' -Wait
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\Calcite'
          if (-not (Test-Path "$dir\calcite-login.exe")) { throw "not installed in $dir" }
          $help = Start-Process "$dir\calcite.exe" -ArgumentList 'help' -Wait -PassThru
          if ($help.ExitCode -ne 0) { throw "calcite help exited with $($help.ExitCode)" }
          $env:CALCITE_DATA_ID = 'CalciteCI'
          $app = Start-Process "$dir\calcite.exe" -PassThru
          Start-Sleep 25
          if ($app.HasExited) { throw "Calcite quit by itself (exit $($app.ExitCode))" }
          $log = Join-Path $env:APPDATA 'CalciteCI\calcite.log'
          Get-Content $log
          if (-not (Select-String -Path $log -Pattern 'backend init finished .*: ok' -Quiet)) { throw 'the data folder did not open' }
          Stop-Process -Id $app.Id
          Remove-Item Env:\CALCITE_DATA_ID

          # Portable: everything stays next to calcite.exe.
          $portable = Join-Path $env:RUNNER_TEMP 'portable'
          Expand-Archive (Get-ChildItem dist\*-portable.zip)[0].FullName -DestinationPath $portable
          $app = Start-Process "$portable\calcite.exe" -PassThru
          Start-Sleep 25
          if ($app.HasExited) { throw "portable Calcite quit by itself (exit $($app.ExitCode))" }
          if (-not (Test-Path "$portable\data\calcite.log")) { throw 'portable mode did not keep its data next to calcite.exe' }
          Stop-Process -Id $app.Id

      - uses: actions/upload-artifact@v4
        if: (github.event_name == 'workflow_dispatch' && inputs.release) || startsWith(github.ref, 'refs/tags/')
        with:
          name: calcite-${{ runner.os }}
          path: dist/
          if-no-files-found: error

      # A version tag also gets a draft GitHub release with every installer,
      # to check and publish by hand.
      - name: Attach to the draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --draft --generate-notes --title "Calcite ${GITHUB_REF_NAME#v}" \
            || true
          find dist -maxdepth 1 -type f -print0 | xargs -0 gh release upload "$GITHUB_REF_NAME" --clobber
